<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingspan Proctor - Exact Layout</title>
    <style>
        :root {
            /* Layout Colors */
            --bg-dark-blue: #192132; /* Used for gaps and blue header */
            --bg-white: #ffffff;
            --bg-gray: #f3f4f6;
            --border-color: #e5e7eb;
            
            /* Text Colors */
            --text-main: #333333;
            --text-muted: #6b7280;
            --text-light: #f9fafb;
            
            /* Accents */
            --accent-green: #22c55e;
            --accent-teal: #78c2bd;
            --accent-red: #e14d60;
            --footer-bg: #d4f0f0;

            /* Editor Light Mode */
            --editor-bg-light: #ffffff;
            --editor-lines-light: #f9fafb;
            --editor-text-light: #374151;
            
            /* Editor Dark Mode */
            --editor-bg-dark: #1e1e1e;
            --editor-lines-dark: #252526;
            --editor-text-dark: #d4d4d4;
            --syntax-keyword: #569cd6;
            --syntax-string: #ce9178;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: var(--bg-dark-blue);
        }

        /* --- ROW 1: TOP WHITE BAR --- */
        .header-white {
            height: 50px;
            background-color: var(--bg-white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 0 65px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .title-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title-text {
            font-weight: 700;
            font-size: 14px;
            color: #111827;
        }

        .title-version {
            font-weight: 500;
            font-size: 11px;
            color: var(--text-muted);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-red); /* Matched to user's photo */
            border-radius: 50%;
        }

        .btn-exit {
            background: transparent;
            border: 1px solid #d1d5db;
            color: #374151;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* --- ROW 2: SUB BLUE BAR --- */
        .header-blue {
            height: 50px;
            background-color: var(--bg-dark-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .blue-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .site-logo {
            display: block;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .site-logo.white {
            width: 48px;
            height: 48px;
            position: absolute;
            left: 20px;
            top: 9px;
            z-index: 1;
        }

        .site-logo.blue {
            width: 48px;
            height: 48px;
        }

        .avatar-circle {
            width: 32px;
            height: 32px;
            background-color: #6b7280;
            border-radius: 50%;
        }

        .timer-pill {
            background-color: var(--bg-white);
            color: #111827;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #d1d5db;
        }

        .blue-right {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--bg-white);
        }

        .tool-icons {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }
        
        .tool-icons i {
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .tool-icons i:hover {
            color: var(--accent-teal);
        }

        .btn-finish {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        /* --- MAIN CONTENT AREA --- */
        .main-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            background-color: var(--bg-dark-blue);
        }

        /* --- SIDEBAR --- */
        .sidebar-white {
            width: 50px;
            background-color: var(--bg-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--border-color);
            transition: width 0.2s ease;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-toggle-btn {
            width: 100%;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: #6b7280;
            cursor: pointer;
            flex-shrink: 0;
            transition: color 0.15s ease;
        }

        .sidebar-toggle-btn:hover {
            color: var(--accent-teal);
        }

        .sidebar-icons {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
            gap: 20px;
            width: 100%;
            transition: opacity 0.15s ease;
        }

        .sidebar-white.collapsed {
            width: 28px;
        }

        .sidebar-white.collapsed .sidebar-icons {
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-white i {
            color: #6b7280;
            font-size: 18px;
            cursor: pointer;
        }

        /* --- PANELS LAYOUT --- */
        .panels-wrapper {
            display: flex;
            flex: 1;
            padding: 12px;
            gap: 12px;
            background-color: var(--bg-dark-blue); /* Dark blue gaps */
        }

        /* Left Panel (Description) */
        .left-panel {
            flex: 1;
            background-color: var(--bg-white);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .question-nav {
            display: flex;
            gap: 8px;
            padding: 12px 16px 0;
            flex-shrink: 0;
        }

        .question-nav-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: var(--bg-white);
            color: #4b5563;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .question-nav-btn:hover {
            border-color: var(--accent-teal);
            color: #111827;
        }

        .question-nav-btn.active {
            background-color: var(--accent-teal);
            border-color: var(--accent-teal);
            color: #ffffff;
        }

        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 13px;
            color: #4b5563;
        }
        
        .panel-title strong {
            color: #111827;
            font-weight: 600;
        }

        .description-content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            font-size: 13px;
            line-height: 1.6;
            color: #374151;
            position: relative;
        }

        .description-content::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 20px;
            bottom: 20px;
            width: 3px;
            background-color: var(--accent-teal);
            border-radius: 2px;
        }

        .desc-text {
            padding-left: 15px;
        }

        .desc-text p {
            margin-bottom: 12px;
        }

        .desc-text h3 {
            font-size: 15px;
            margin: 15px 0 10px 0;
            color: #111827;
        }

        /* Right Side Panels */
        .right-column {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- EDITOR PANEL --- */
        .editor-container {
            flex: 1;
            background-color: var(--editor-bg-light);
            border-radius: 8px;
            display: flex;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        .editor-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .editor-lang-select-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .editor-lang-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .editor-lang-select {
            border: 1px solid var(--border-color);
            background: var(--bg-white);
            color: #374151;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            min-width: 88px;
            outline: none;
        }

        .editor-lang-select:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 2px rgba(120, 194, 189, 0.18);
        }

        /* Dark Mode Classes for Editor */
        .editor-container.dark-theme {
            background-color: var(--editor-bg-dark);
        }

        .line-numbers {
            width: 40px;
            background-color: var(--editor-lines-light);
            border-right: 1px solid var(--border-color);
            padding: 15px 0 15px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            font-family: monospace;
            transition: background-color 0.3s, border-color 0.3s;
            user-select: none;
            overflow: hidden;
        }

        .editor-container.dark-theme .line-numbers {
            background-color: var(--editor-lines-dark);
            border-right: 1px solid #333;
            color: #858585;
        }

        .code-surface {
            position: relative;
            flex: 1;
            overflow: hidden;
            min-width: 0;
        }

        .code-highlight,
        .code-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre;
            overflow: auto;
            box-sizing: border-box;
        }

        .code-highlight {
            color: var(--editor-text-light);
            pointer-events: none;
            transition: color 0.3s;
        }

        .editor-container.dark-theme .code-highlight {
            color: var(--editor-text-dark);
        }

        textarea.code-area {
            border: none;
            outline: none;
            background: transparent;
            resize: none;
            color: transparent;
            caret-color: #374151;
        }

        .editor-container.dark-theme textarea.code-area {
            caret-color: #d4d4d4;
        }

        textarea.code-area::selection {
            background: rgba(120, 194, 189, 0.35);
        }
        
        .tok-keyword { color: #0000ff; font-weight: bold; }
        .tok-string { color: #a31515; }
        .tok-comment { color: #008000; font-style: italic; }
        .tok-number { color: #098658; }
        .tok-func { color: #795e26; }
        
        .editor-container.dark-theme .tok-keyword { color: var(--syntax-keyword); font-weight: normal; }
        .editor-container.dark-theme .tok-string { color: var(--syntax-string); }
        .editor-container.dark-theme .tok-comment { color: #6a9955; font-style: italic; }
        .editor-container.dark-theme .tok-number { color: #b5cea8; }
        .editor-container.dark-theme .tok-func { color: #dcdcaa; }

        /* --- UTILITY BAR: minimal, single-row controls (font size, language, reset, full screen, theme) --- */
        .utility-bar {
            height: 36px;
            background-color: var(--bg-white);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 20px;
        }

        .utility-bar-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .utility-font-btn {
            background: none;
            border: none;
            padding: 0;
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .utility-font-btn:hover:not(:disabled) {
            color: var(--accent-teal);
        }

        .utility-font-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .utility-icon-btn {
            background: none;
            border: none;
            padding: 0;
            font-size: 14px;
            color: #4b5563;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            transition: color 0.15s ease;
        }

        .utility-icon-btn:hover {
            color: var(--accent-teal);
        }

        .utility-icon-btn:focus-visible,
        .utility-font-btn:focus-visible {
            outline: 2px solid var(--accent-teal);
            outline-offset: 2px;
        }

        .utility-lang-select {
            border: 1px solid var(--border-color);
            background: var(--bg-gray);
            color: #374151;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .utility-lang-select:focus {
            border-color: var(--accent-teal);
        }

        /* Sandbox full screen mode: expands the editor panel to fill the viewport */
        .editor-container.sandbox-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border-radius: 0;
        }

        /* Functional timer states */
        .timer-pill.timer-warning {
            background-color: #fef3c7;
            color: #b45309;
            border-color: #fcd34d;
        }

        .timer-pill.timer-critical {
            background-color: #fee2e2;
            color: #b91c1c;
            border-color: #fca5a5;
            animation: pulse-timer 1s infinite;
        }

        .timer-pill.timer-expired {
            background-color: var(--accent-red);
            color: #ffffff;
            border-color: var(--accent-red);
        }

        @keyframes pulse-timer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        .editor-tools {
            width: 30px;
            background-color: var(--bg-white);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 0;
            gap: 15px;
            color: #6b7280;
            font-size: 12px;
        }

        /* --- TEST CASES PANEL --- */
        .test-panel {
            height: 280px;
            background-color: var(--bg-white);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .test-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-white);
        }

        .tab {
            padding: 10px 25px;
            font-size: 12px;
            color: #6b7280;
            cursor: pointer;
            font-weight: 500;
        }

        .tab.active {
            color: #111827;
            background-color: var(--bg-white);
            border-top: 2px solid var(--accent-teal);
            border-right: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color);
            margin-bottom: -1px;
        }

        .test-content {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cases-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .case-btn {
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #374151;
            background: var(--bg-gray);
            cursor: pointer;
        }

        .case-btn i {
            color: var(--accent-green);
        }

        .test-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }
        
        .console-toggle {
            font-size: 12px;
            color: #4b5563;
            cursor: pointer;
        }

        .legends {
            display: flex;
            gap: 15px;
            font-size: 11px;
            color: #4b5563;
        }

        .legend-item i.fa-circle-check { color: var(--accent-green); }
        .legend-item i.fa-circle-xmark { color: var(--accent-red); }
        .legend-item i.fa-clock { color: #6b7280; }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }

        .btn-teal {
            background-color: var(--accent-teal);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        /* --- FOOTER --- */
        .footer-bar {
            height: 24px;
            background-color: var(--footer-bg);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 15px;
            font-size: 11px;
            color: #0d9488;
            gap: 12px;
            border-top: 1px solid #99f6e4;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header-white">
        <div class="title-group">
            <div class="title-text">Wingspan Proctor <span class="title-version">v2.7.2</span></div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                Exam environment is active
            </div>
        </div>
        <button class="btn-exit"><i class="fa-solid fa-arrow-right-from-bracket"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12" style="vertical-align:-1px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></i> Exit App</button>
    </header>

    <div class="header-blue">
        <div class="blue-left">
            <img class="site-logo blue" src="image.png" alt="Wingspan logo">
            <div class="avatar-circle"></div>
        </div>
        <div class="timer-pill" id="exam-timer">2 hr 55 min 24 sec</div>
        <div class="blue-right">
            <button class="btn-finish">Finish</button>
        </div>
    </div>

    <div class="utility-bar">
        <div class="utility-bar-controls">
            <button type="button" class="utility-font-btn" id="font-decrease-btn" title="Decrease font size" aria-label="Decrease font size">A-</button>
            <button type="button" class="utility-font-btn" id="font-increase-btn" title="Increase font size" aria-label="Increase font size">A+</button>
            <select class="utility-lang-select" id="language-select" aria-label="Select language" title="Select language">
                <option value="python">Python</option>
                <option value="cpp">CP</option>
            </select>
            <button type="button" class="utility-icon-btn" id="reset-code-btn" title="Reset code to template" aria-label="Reset code to template">
                <i class="fa-solid fa-arrow-rotate-left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="vertical-align:-2px"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></i>
            </button>
            <button type="button" class="utility-icon-btn" id="sandbox-fullscreen-btn" title="Full screen" aria-label="Toggle full screen">
                <i class="fa-solid fa-expand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="vertical-align:-2px"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></i>
            </button>
            <button type="button" class="utility-icon-btn" id="sandbox-theme-btn" title="Switch to light mode" aria-label="Toggle editor theme">
                <i class="fa-solid fa-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="vertical-align:-2px"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></i>
            </button>
        </div>
    </div>

    <div class="main-body">
        
        <aside class="sidebar-white" id="app-sidebar">
            <button type="button" class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Collapse sidebar" aria-label="Toggle sidebar">
                <svg id="sidebar-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="15 18 9 12 15 6"/></svg>
            </button>

<script>
    const questions = [
        {
            number: 1,
            difficulty: 'Easy',
            title: 'Maximum Channel Load',
            body: `
                <p>You are given an array of <strong>N</strong> positive integers representing signal loads carried on <strong>N</strong> channels. Find the maximum sum of any <strong>K</strong> consecutive channels.</p>
                <h3>Input</h3>
                <p>First line: two integers <strong>N</strong> and <strong>K</strong>.<br>Second line: <strong>N</strong> space-separated integers, the channel loads.</p>
                <h3>Output</h3>
                <p>A single integer &mdash; the maximum sum of any <strong>K</strong> consecutive channels.</p>
                <h3>Example</h3>
                <p>Input:<br>6 3<br>2 1 5 1 3 2<br>Output:<br>9<br>Explanation: channels [5, 1, 3] give the largest sum, 9.</p>
                <h3>Constraints</h3>
                <p>1 &le; K &le; N &le; 10<sup>5</sup><br>1 &le; load[i] &le; 10<sup>4</sup></p>
            `

        {
            number: 2,
            difficulty: 'Medium',
            title: 'Wavelength Division Multiplexing',
            body: `
                <p>You are operating a fiber optic network using Wavelength Division Multiplexing (WDM). There are <strong>N</strong> channels, and channel <strong>i</strong> carries a signal of wavelength <strong>A[i]</strong> (a positive integer). Two channels <strong>i</strong> and <strong>j</strong> (i &ne; j) can be multiplexed together on the same fiber only if the bitwise AND of their wavelengths is zero.</p>
                <p>Count the number of pairs (i, j), with i &lt; j, that can be multiplexed together.</p>
                <h3>Input</h3>
                <p>First line: integer <strong>N</strong>.<br>Second line: <strong>N</strong> space-separated integers, the wavelengths <strong>A[1..N]</strong>.</p>
                <h3>Output</h3>
                <p>A single integer &mdash; the count of valid pairs.</p>
                <h3>Example</h3>
                <p>Input:<br>4<br>1 2 4 3<br>Output:<br>4<br>Explanation: the valid pairs are (1,2), (1,4), (2,4), (4,3) &mdash; each pair ANDs to 0.</p>
                <h3>Constraints</h3>
                <p>1 &le; N &le; 2000<br>0 &le; A[i] &le; 10<sup>9</sup></p>
            `
        },
        {
            number: 3,
            difficulty: 'Medium',
            title: 'Longest Clean Transmission Window',
            body: `
                <p>A link transmits a sequence of packet types, given as a string <strong>S</strong> of lowercase letters. Find the length of the longest contiguous window that contains at most <strong>K</strong> distinct packet types.</p>

                <p>First line: the string <strong>S</strong>.<br>Second line: integer <strong>K</strong>.</p>
                <h3>Output</h3>

                <h3>Example</h3>
                <p>Input:<br>eceba<br>2<br>Output:<br>3<br>Explanation: the window "ece" has 2 distinct characters and length 3.</p>
                <h3>Constraints</h3>
                <p>1 &le; |S| &le; 10<sup>5</sup><br>1 &le; K &le; 26</p>
            `

        {
            number: 4,
            difficulty: 'Hard',
            title: 'Network Node Reachability',
            body: `
                <p>A network has <strong>N</strong> nodes and <strong>M</strong> bidirectional fiber links. You are given <strong>Q</strong> queries, each asking whether node <strong>U</strong> can reach node <strong>V</strong> through the fiber links.</p>
                <h3>Input</h3>
                <p>First line: integers <strong>N</strong> and <strong>M</strong>.<br>Next <strong>M</strong> lines: two integers <strong>u v</strong>, a link between nodes u and v.<br>Next line: integer <strong>Q</strong>.<br>Next <strong>Q</strong> lines: two integers <strong>u v</strong>, a query.</p>
                <h3>Output</h3>
                <p>For each query, print <strong>YES</strong> if u and v are connected, otherwise <strong>NO</strong>.</p>
                <h3>Example</h3>
                <p>Input:<br>5 3<br>1 2<br>2 3<br>4 5<br>2<br>1 3<br>1 4<br>Output:<br>YES<br>NO</p>
                <h3>Constraints</h3>
                <p>1 &le; N &le; 10<sup>5</sup><br>0 &le; M &le; 10<sup>5</sup><br>1 &le; Q &le; 10<sup>5</sup></p>
            `
        }
    ];

    const languageTemplates = {
        python: `import sys

def solve():
    pass

if __name__ == "__main__":
    solve()
`,
        cpp: `#include <bits/stdc++.h>
using namespace std;

int main() {
    ios::sync_with_stdio(false);
    cin.tie(nullptr);

    return 0;
}
`
    };

    const editorState = {
        activeLanguage: 'python',
        drafts: {
            python: languageTemplates.python,
            cpp: languageTemplates.cpp
        }
    };

    const editor = document.getElementById('code-editor');
    const codeArea = document.getElementById('code-area');
    const lineNumbers = editor.querySelector('.line-numbers');
    const codeHighlightPre = document.getElementById('code-highlight');
    const codeHighlightCode = document.getElementById('code-highlight-code');
    const languageSelect = document.getElementById('language-select');
    const fontDecreaseBtn = document.getElementById('font-decrease-btn');
    const fontIncreaseBtn = document.getElementById('font-increase-btn');
    const sandboxThemeBtn = document.getElementById('sandbox-theme-btn');
    const resetCodeBtn = document.getElementById('reset-code-btn');
    const fullscreenBtn = document.getElementById('sandbox-fullscreen-btn');

    // --- Lightweight syntax highlighter (no external library needed) ---
    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    const pythonTokenRegex = /(#.*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+\.?\d*\b)|(\b(?:def|return|if|elif|else|for|while|in|import|from|as|class|pass|break|continue|True|False|None|and|or|not|is|lambda|with|try|except|finally|raise|yield|global|nonlocal|assert|del|print)\b)/gm;
    const cppTokenRegex = /(\/\/.*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+\.?\d*\b)|(\b(?:int|long|double|float|char|bool|void|if|else|for|while|do|return|break|continue|switch|case|default|struct|class|public|private|protected|include|using|namespace|const|static|template|typename|true|false|nullptr|new|delete|auto)\b)/gm;

    function highlightCode(code, language) {
        const regex = language === 'python' ? pythonTokenRegex : cppTokenRegex;
        const escaped = escapeHtml(code);
        return escaped.replace(regex, (match, comment, string, number, keyword) => {
            if (comment) return '<span class="tok-comment">' + comment + '</span>';
            if (string) return '<span class="tok-string">' + string + '</span>';
            if (number) return '<span class="tok-number">' + number + '</span>';
            if (keyword) return '<span class="tok-keyword">' + keyword + '</span>';
            return match;
        });
    }

    function updateHighlight() {
        codeHighlightCode.innerHTML = highlightCode(codeArea.value, editorState.activeLanguage);
    }

    function updateLineNumbers() {
        const lineCount = Math.max(codeArea.value.split('\n').length, 1);
        lineNumbers.innerHTML = Array.from({ length: lineCount }, (_, index) => `<div>${index + 1}</div>`).join('');
    }

    function loadLanguage(language) {
        editorState.drafts[editorState.activeLanguage] = codeArea.value;
        editorState.activeLanguage = language;
        codeArea.value = editorState.drafts[language] || languageTemplates[language];
        if (languageSelect.value !== language) {
            languageSelect.value = language;
        }
        updateLineNumbers();
        updateHighlight();
        codeArea.focus();
    }

    codeArea.value = editorState.drafts.python;
    updateLineNumbers();
    updateHighlight();

    codeArea.addEventListener('input', () => {
        editorState.drafts[editorState.activeLanguage] = codeArea.value;
        updateLineNumbers();
        updateHighlight();
    });

    codeArea.addEventListener('scroll', () => {
        codeHighlightPre.scrollTop = codeArea.scrollTop;
        codeHighlightPre.scrollLeft = codeArea.scrollLeft;
        lineNumbers.scrollTop = codeArea.scrollTop;
    });

    languageSelect.addEventListener('change', () => {
        loadLanguage(languageSelect.value);
    });

    // Toggle dark mode for the coding sandbox (shared by the header icons and the sandbox toolbar)
    function toggleEditorTheme(theme) {
        if (theme === 'dark') {
            editor.classList.add('dark-theme');
        } else {
            editor.classList.remove('dark-theme');
        }
        syncSandboxThemeIcon();
    }

    function syncSandboxThemeIcon() {
        const isDark = editor.classList.contains('dark-theme');
        sandboxThemeBtn.innerHTML = isDark ? '<i class="fa-solid fa-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="vertical-align:-2px"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></i>' : '<i class="fa-solid fa-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="vertical-align:-2px"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></i>';
        sandboxThemeBtn.title = isDark ? 'Switch to light mode' : 'Switch to dark mode';
    }

    sandboxThemeBtn.addEventListener('click', () => {
        toggleEditorTheme(editor.classList.contains('dark-theme') ? 'light' : 'dark');
    });

    syncSandboxThemeIcon();

    // --- Font size controls ---
    const MIN_FONT_SIZE = 11;
    const MAX_FONT_SIZE = 21;
    let currentFontSize = 13;

    function applyFontSize() {
        codeArea.style.fontSize = currentFontSize + 'px';
        lineNumbers.style.fontSize = currentFontSize + 'px';
        codeHighlightPre.style.fontSize = currentFontSize + 'px';
        fontDecreaseBtn.disabled = currentFontSize <= MIN_FONT_SIZE;
        fontIncreaseBtn.disabled = currentFontSize >= MAX_FONT_SIZE;
    }

    fontDecreaseBtn.addEventListener('click', () => {
        currentFontSize = Math.max(MIN_FONT_SIZE, currentFontSize - 1);
        applyFontSize();
    });

    fontIncreaseBtn.addEventListener('click', () => {
        currentFontSize = Math.min(MAX_FONT_SIZE, currentFontSize + 1);
        applyFontSize();
    });

    applyFontSize();

    // --- Reset code back to the default template ---
    resetCodeBtn.addEventListener('click', () => {
        const confirmed = window.confirm('Reset the code to the default template? Your current changes will be lost.');
        if (!confirmed) return;
        const lang = editorState.activeLanguage;
        codeArea.value = languageTemplates[lang];
        editorState.drafts[lang] = languageTemplates[lang];
        updateLineNumbers();
        updateHighlight();
        codeArea.focus();
    });

    // --- Full screen toggle for the sandbox ---
    function setSandboxFullscreen(isFull) {
        editor.classList.toggle('sandbox-fullscreen', isFull);
        fullscreenBtn.innerHTML = isFull ? '<i class="fa-solid fa-compress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="vertical-align:-2px"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg></i>' : '<i class="fa-solid fa-expand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="vertical-align:-2px"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></i>';
        fullscreenBtn.title = isFull ? 'Exit full screen' : 'Full screen';
    }

    fullscreenBtn.addEventListener('click', () => {
        setSandboxFullscreen(!editor.classList.contains('sandbox-fullscreen'));
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && editor.classList.contains('sandbox-fullscreen')) {
            setSandboxFullscreen(false);
        }
    });

    // --- Question navigator (4 DSA questions) ---
    const questionHeading = document.getElementById('question-heading');
    const questionBody = document.getElementById('question-body');
    const questionNavBtns = document.querySelectorAll('.question-nav-btn');

    function renderQuestion(index) {
        const q = questions[index];
        questionHeading.textContent = q.number + ': ' + q.difficulty + ' : ' + q.title;
        questionBody.innerHTML = q.body;
        questionNavBtns.forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });
    }

    questionNavBtns.forEach((btn, i) => {
        btn.addEventListener('click', () => renderQuestion(i));
    });

    renderQuestion(1);

    // --- Collapsible sidebar ---
    const appSidebar = document.getElementById('app-sidebar');
    const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
    const sidebarToggleIcon = document.getElementById('sidebar-toggle-icon');

    sidebarToggleBtn.addEventListener('click', () => {
        const collapsed = appSidebar.classList.toggle('collapsed');
        sidebarToggleIcon.innerHTML = collapsed
            ? '<polyline points="9 18 15 12 9 6"></polyline>'
            : '<polyline points="15 18 9 12 15 6"></polyline>';
        sidebarToggleBtn.title = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
    });

    // --- Functional countdown timer ---
    (function initExamTimer() {
        const timerEl = document.getElementById('exam-timer');
        let secondsLeft = 2 * 3600 + 55 * 60 + 24;

        function formatTime(totalSeconds) {
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            return `${hrs} hr ${String(mins).padStart(2, '0')} min ${String(secs).padStart(2, '0')} sec`;
        }

        timerEl.textContent = formatTime(secondsLeft);

        const timerInterval = setInterval(() => {
            secondsLeft--;
            if (secondsLeft <= 0) {
                timerEl.textContent = "Time's up";
                timerEl.classList.add('timer-expired');
                clearInterval(timerInterval);
                return;
            }
            timerEl.textContent = formatTime(secondsLeft);
            if (secondsLeft <= 60) {
                timerEl.classList.add('timer-critical');
            } else if (secondsLeft <= 300) {
                timerEl.classList.add('timer-warning');
            }
        }, 1000);
    })();
</script>
