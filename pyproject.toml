[project]
name = "ledgerguard"
version = "0.1.0"
description = "AI Finance Controller that reconciles Razorpay orders/payments/refunds against a bank statement and internal ledger, and knows when not to act."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.6",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "razorpay>=1.4",
    "anthropic>=0.69",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# L2 defaults to Anthropic (a base dependency, since every doc/pricing table in this repo was
# written against it) or the free fallback. These two are only imported, lazily, by
# l2_llm_triage/factory.py when the matching credential is set -- not needed for
# make close/make demo/make bench/the deployed API, so they stay optional rather than bloating
# every install.
openai = ["openai>=1.0"]
gemini = ["google-generativeai>=0.8"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
